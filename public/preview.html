<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prévia do site</title><style>body{margin:0;font:15px system-ui;background:#f3f3ef;color:#171717}.notice{position:fixed;z-index:99;left:50%;top:14px;transform:translateX(-50%);background:#111;color:#fff;border-radius:999px;padding:10px 16px;box-shadow:0 10px 30px #0003}.notice b{color:#b9ff68}.expired{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.expired div{max-width:520px;background:#fff;border-radius:24px;padding:45px;box-shadow:0 20px 60px #0001}.expired h1{font-size:38px;margin:0 0 12px}.expired p{color:#666;line-height:1.6}</style></head><body><div id="notice"></div><main id="root"></main><script src="/site-quality.js"></script><script>(function(){const q=new URLSearchParams(location.search),exp=Number(q.get('expires')),data=q.get('data');const root=document.getElementById('root'),notice=document.getElementById('notice');if(!exp||!data||Date.now()>exp){root.innerHTML='<div class="expired"><div><h1>Prévia encerrada</h1><p>Este link de demonstração não está mais disponível. Solicite ao responsável uma nova prévia do projeto.</p></div></div>';return}try{const raw=decodeURIComponent(escape(atob(data)));const p=JSON.parse(raw);notice.innerHTML='<div class="notice">PRÉVIA DO CLIENTE · <b>válida até '+new Date(exp).toLocaleDateString('pt-BR')+'</b></div>';document.title=(p.businessName||'Site')+' — Prévia';root.innerHTML=window.site(p)}catch(e){root.innerHTML='<div class="expired"><div><h1>Não foi possível abrir</h1><p>O link de prévia está inválido ou incompleto.</p></div></div>'}})();</script></body></html>
